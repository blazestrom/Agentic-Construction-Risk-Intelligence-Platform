version: '3.8'

services:
  api:
    build: .
    container_name: construction-risk-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/construction_risk
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: construction-risk-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=construction_risk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
