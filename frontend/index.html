<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentic Construction Risk Intelligence Platform</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Chart.js for visualizations -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #1c2028;
      --neu-dark: #14171d;
      --neu-light: #242933;
    }
    body {
      background-color: var(--bg-base);
      color: #e2e8f0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    code, pre { font-family: 'JetBrains Mono', monospace; }

    /* Neumorphic Extruded Cards (Raised 3D effect) */
    .neu-card {
      background: #1c2028;
      border-radius: 1.25rem;
      box-shadow: 8px 8px 20px var(--neu-dark), -8px -8px 20px var(--neu-light);
      border: 1px solid rgba(255, 255, 255, 0.03);
    }
    .neu-card-sm {
      background: #1c2028;
      border-radius: 0.875rem;
      box-shadow: 5px 5px 12px var(--neu-dark), -5px -5px 12px var(--neu-light);
      border: 1px solid rgba(255, 255, 255, 0.02);
    }

    /* Neumorphic Inset Wells (Sunken / Recessed effect) */
    .neu-inset {
      background: #171a21;
      border-radius: 1rem;
      box-shadow: inset 5px 5px 12px var(--neu-dark), inset -5px -5px 12px var(--neu-light);
      border: 1px solid rgba(0, 0, 0, 0.25);
    }
    .neu-inset-sm {
      background: #171a21;
      border-radius: 0.625rem;
      box-shadow: inset 3px 3px 7px var(--neu-dark), inset -3px -3px 7px var(--neu-light);
    }

    /* Neumorphic Buttons */
    .neu-btn {
      background: #1c2028;
      box-shadow: 5px 5px 12px var(--neu-dark), -5px -5px 12px var(--neu-light);
      border: 1px solid rgba(255, 255, 255, 0.04);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .neu-btn:hover:not(:disabled) {
      box-shadow: 7px 7px 16px var(--neu-dark), -7px -7px 16px var(--neu-light);
      transform: translateY(-1px);
    }
    .neu-btn:active:not(:disabled) {
      box-shadow: inset 3px 3px 8px var(--neu-dark), inset -3px -3px 8px var(--neu-light);
      transform: translateY(1px);
    }

    /* Primary Accent Button with Neumorphic Glow */
    .neu-btn-primary {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      box-shadow: 6px 6px 16px var(--neu-dark), -6px -6px 16px var(--neu-light), 0 0 20px rgba(37, 99, 235, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .neu-btn-primary:hover:not(:disabled) {
      box-shadow: 8px 8px 20px var(--neu-dark), -8px -8px 20px var(--neu-light), 0 0 28px rgba(37, 99, 235, 0.55);
      transform: translateY(-1px);
    }
    .neu-btn-primary:active:not(:disabled) {
      box-shadow: inset 3px 3px 8px #172554, inset -3px -3px 8px #3b82f6;
      transform: translateY(1px);
    }

    /* Custom Neumorphic Range Slider */
    input[type="range"] {
      -webkit-appearance: none;
      background: #171a21;
      height: 8px;
      border-radius: 9999px;
      box-shadow: inset 2px 2px 6px var(--neu-dark), inset -2px -2px 6px var(--neu-light);
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #3b82f6;
      box-shadow: 3px 3px 8px var(--neu-dark), -3px -3px 8px var(--neu-light), 0 0 10px #3b82f6;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    /* Soft Neumorphic Badges */
    .neu-badge {
      box-shadow: 3px 3px 8px var(--neu-dark), -3px -3px 8px var(--neu-light);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #171a21;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #28303d;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3b82f6;
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 antialiased selection:bg-blue-600 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const API_BASE = (window.location.origin && window.location.origin.startsWith('http')) 
      ? window.location.origin 
      : 'http://localhost:8000';

    function RiskBadge({ level }) {
      const styles = {
        CRITICAL: "bg-red-500/15 text-red-400 border-red-500/30 shadow-[0_0_12px_rgba(239,68,68,0.25)]",
        HIGH: "bg-orange-500/15 text-orange-400 border-orange-500/30 shadow-[0_0_12px_rgba(249,115,22,0.25)]",
        MEDIUM: "bg-amber-500/15 text-amber-400 border-amber-500/30 shadow-[0_0_12px_rgba(245,158,11,0.25)]",
        LOW: "bg-emerald-500/15 text-emerald-400 border-emerald-500/30 shadow-[0_0_12px_rgba(16,185,129,0.25)]"
      };
      return (
        <span className={`px-3 py-1 text-xs font-semibold rounded-full border neu-badge tracking-wide ${styles[level] || styles.LOW}`}>
          {level}
        </span>
      );
    }

    function App() {
      const [summary, setSummary] = useState(null);
      const [modelInfo, setModelInfo] = useState(null);
      const [history, setHistory] = useState([]);
      const [loading, setLoading] = useState(true);
      const [uploading, setUploading] = useState(false);
      const [currentAssessment, setCurrentAssessment] = useState(null);
      const [selectedFile, setSelectedFile] = useState(null);
      const [previewUrl, setPreviewUrl] = useState(null);
      const [confThreshold, setConfThreshold] = useState(0.25);
      const [error, setError] = useState(null);

      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      // Load initial dashboard data
      const fetchData = async () => {
        try {
          const [sumRes, modelRes, histRes] = await Promise.all([
            fetch(`${API_BASE}/dashboard/summary`),
            fetch(`${API_BASE}/model/info`),
            fetch(`${API_BASE}/risks?limit=8`)
          ]);
          
          if (sumRes.ok) setSummary(await sumRes.json());
          if (modelRes.ok) setModelInfo(await modelRes.json());
          if (histRes.ok) {
            const hData = await histRes.json();
            setHistory(hData.assessments || []);
          }
        } catch (err) {
          console.error("Fetch error:", err);
          setError("Failed to connect to backend API. Ensure FastAPI server is running on port 8000.");
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchData();
      }, []);

      // Render Severity Distribution Chart
      useEffect(() => {
        if (!summary || !chartRef.current) return;
        const sev = summary.severity_distribution || { LOW: 0, MEDIUM: 0, HIGH: 0, CRITICAL: 0 };
        
        if (chartInstance.current) {
          chartInstance.current.destroy();
        }

        const ctx = chartRef.current.getContext('2d');
        chartInstance.current = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: ['Low', 'Med', 'High', 'Crit'],
            datasets: [{
              data: [sev.LOW || 0, sev.MEDIUM || 0, sev.HIGH || 0, sev.CRITICAL || 0],
              backgroundColor: ['#10b981', '#f59e0b', '#f97316', '#ef4444'],
              borderWidth: 2,
              borderColor: '#171a21'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: 'bottom',
                labels: { color: '#94a3b8', boxWidth: 10, font: { size: 10 } }
              }
            },
            cutout: '72%'
          }
        });
      }, [summary]);

      // File selection handler
      const handleFileSelect = (e) => {
        const file = e.target.files[0];
        if (file) {
          setSelectedFile(file);
          setPreviewUrl(URL.createObjectURL(file));
        }
      };

      // Upload and Assess Risk
      const handleAssess = async () => {
        if (!selectedFile) return;
        setUploading(true);
        setError(null);

        const formData = new FormData();
        formData.append("file", selectedFile);
        formData.append("conf_threshold", confThreshold);

        try {
          const res = await fetch(`${API_BASE}/risk/assess`, {
            method: "POST",
            body: formData
          });

          if (!res.ok) {
            const errData = await res.json();
            throw new Error(errData.detail || "Analysis failed");
          }

          const data = await res.json();
          setCurrentAssessment(data);
          fetchData(); // refresh counters and history
        } catch (err) {
          setError(err.message);
        } finally {
          setUploading(false);
        }
      };

      const getScoreColor = (score) => {
        if (score >= 75) return "text-red-400";
        if (score >= 50) return "text-orange-400";
        if (score >= 25) return "text-amber-400";
        return "text-emerald-400";
      };

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-8 space-y-7">
          
          {/* Header */}
          <header className="neu-card p-5 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div className="flex items-center gap-4">
              <div className="w-12 h-12 rounded-2xl neu-inset flex items-center justify-center text-amber-400 text-2xl font-bold shadow-sm">
                ⚠️
              </div>
              <div>
                <div className="flex items-center gap-2.5 flex-wrap">
                  <h1 className="text-xl sm:text-2xl font-extrabold tracking-tight text-slate-100">
                    Construction Risk Intelligence
                  </h1>
                  <span className="px-2.5 py-0.5 text-[11px] font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/20 rounded-md neu-badge">
                    YOLOv8 + Agentic Risk Engine
                  </span>
                </div>
                <p className="text-xs text-slate-400 mt-0.5">
                  Neumorphic Safety Monitoring & Explainable Hazard Assessment Platform
                </p>
              </div>
            </div>

            {/* Model & System Badge */}
            <div className="neu-inset px-4 py-2.5 flex items-center gap-3.5 text-xs text-slate-300">
              <div className="flex items-center gap-2">
                <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981] animate-pulse"></span>
                <span className="font-medium text-slate-400">Model:</span>
                <span className="font-mono text-emerald-400 font-semibold">yolov8n (25 classes)</span>
              </div>
              <span className="text-slate-600">|</span>
              <div className="text-slate-400">
                Device: <span className="font-mono text-slate-200 font-semibold">{modelInfo?.device || "CPU"}</span>
              </div>
            </div>
          </header>

          {error && (
            <div className="neu-card p-4 border border-red-500/30 bg-red-950/20 text-red-300 text-sm flex items-center justify-between">
              <span className="flex items-center gap-2">⚠️ {error}</span>
              <button onClick={() => setError(null)} className="neu-btn px-2 py-0.5 text-xs text-red-400 hover:text-white rounded">✕</button>
            </div>
          )}

          {/* KPI Summary Cards */}
          <section className="grid grid-cols-2 lg:grid-cols-4 gap-5">
            
            {/* Current Site Risk Score */}
            <div className="neu-card p-5 flex flex-col justify-between relative overflow-hidden group">
              <div className="flex items-center justify-between">
                <span className="text-xs font-bold text-slate-400 uppercase tracking-wider">Current Site Risk</span>
                <RiskBadge level={summary?.current_risk_level || "LOW"} />
              </div>
              <div className="my-3 flex items-baseline gap-2">
                <span className={`text-4xl sm:text-5xl font-black font-mono tracking-tight drop-shadow ${getScoreColor(summary?.current_risk_score || 0)}`}>
                  {summary ? summary.current_risk_score : "--"}
                </span>
                <span className="text-xs font-semibold text-slate-500">/ 100</span>
              </div>
              <div className="neu-inset px-3 py-1.5 text-[11px] text-slate-400 flex items-center justify-between">
                <span>Field Alert:</span>
                <span className={`font-semibold ${summary?.current_risk_score >= 50 ? 'text-red-400 animate-pulse' : 'text-emerald-400'}`}>
                  {summary?.current_risk_score >= 50 ? 'DISPATCH REQUIRED' : 'NORMAL (COMPLIANT)'}
                </span>
              </div>
            </div>

            {/* Total Hazards */}
            <div className="neu-card p-5 flex flex-col justify-between">
              <span className="text-xs font-bold text-slate-400 uppercase tracking-wider">Hazards Identified</span>
              <div className="my-3">
                <span className="text-4xl sm:text-5xl font-black font-mono text-slate-100 tracking-tight">
                  {summary ? summary.total_hazards_detected : "--"}
                </span>
              </div>
              <div className="neu-inset px-3 py-1.5 text-[11px] text-slate-400">
                Ground-truth safety rules triggered
              </div>
            </div>

            {/* Monitored Scans */}
            <div className="neu-card p-5 flex flex-col justify-between">
              <span className="text-xs font-bold text-slate-400 uppercase tracking-wider">Site Inspections Run</span>
              <div className="my-3">
                <span className="text-4xl sm:text-5xl font-black font-mono text-slate-100 tracking-tight">
                  {summary ? summary.total_monitored_events : "--"}
                </span>
              </div>
              <div className="neu-inset px-3 py-1.5 text-[11px] text-slate-400">
                Audited & saved in database
              </div>
            </div>

            {/* Severity Distribution Donut */}
            <div className="neu-card p-4 flex flex-col items-center justify-between">
              <span className="text-xs font-bold text-slate-400 uppercase tracking-wider self-start">Severity Breakdown</span>
              <div className="w-full h-24 my-1">
                <canvas ref={chartRef}></canvas>
              </div>
            </div>
          </section>

          {/* Main Workspace Grid */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-7">
            
            {/* Left: Upload & Detection Visualizer (7 cols) */}
            <div className="lg:col-span-7 space-y-5">
              <div className="neu-card p-6">
                
                {/* Header with Slider */}
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-4 mb-4 border-b border-slate-800/40 gap-3">
                  <h2 className="text-sm font-bold text-slate-200 uppercase tracking-wider flex items-center gap-2">
                    <span>📷</span> Visual Inspection & Bounding Boxes
                  </h2>
                  <div className="flex items-center gap-3 neu-inset px-3 py-1.5">
                    <label className="text-xs text-slate-400">Confidence:</label>
                    <input 
                      type="range" 
                      min="0.15" 
                      max="0.80" 
                      step="0.05"
                      value={confThreshold}
                      onChange={(e) => setConfThreshold(parseFloat(e.target.value))}
                      className="w-24 cursor-pointer"
                    />
                    <span className="text-xs font-mono font-bold text-blue-400">{confThreshold.toFixed(2)}</span>
                  </div>
                </div>

                {/* Upload Zone (Recessed Neumorphic Well) */}
                <div className="neu-inset p-5 text-center cursor-pointer hover:border-slate-700 transition">
                  <input
                    type="file"
                    accept="image/*"
                    onChange={handleFileSelect}
                    id="file-upload"
                    className="hidden"
                  />
                  <label htmlFor="file-upload" className="cursor-pointer flex flex-col items-center">
                    <div className="w-12 h-12 rounded-2xl neu-card flex items-center justify-center text-2xl mb-2 text-blue-400">
                      📸
                    </div>
                    <span className="text-sm font-semibold text-slate-200">
                      {selectedFile ? selectedFile.name : "Select or Drop Site Image to Inspect"}
                    </span>
                    <span className="text-xs text-slate-500 mt-1">Supports JPG, PNG, WEBP (YOLOv8 Detection)</span>
                  </label>
                </div>

                {/* Action Bar */}
                <div className="flex justify-between items-center mt-4">
                  <div className="text-xs text-slate-400">
                    {selectedFile ? (
                      <span className="text-emerald-400 flex items-center gap-1.5">
                        <span className="w-2 h-2 rounded-full bg-emerald-400"></span> Ready to run safety evaluation
                      </span>
                    ) : (
                      <span>Select a photo from test/images or camera</span>
                    )}
                  </div>
                  <button
                    onClick={handleAssess}
                    disabled={!selectedFile || uploading}
                    className={`px-5 py-2.5 rounded-xl font-bold text-xs uppercase tracking-wider flex items-center gap-2 transition ${
                      !selectedFile || uploading
                        ? "neu-inset text-slate-600 cursor-not-allowed"
                        : "neu-btn-primary text-white cursor-pointer"
                    }`}
                  >
                    {uploading ? (
                      <>
                        <span className="w-3.5 h-3.5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                        Running Agent Assessment...
                      </>
                    ) : (
                      <>⚡ Run Safety Assessment</>
                    )}
                  </button>
                </div>

                {/* Visualizer Display (Industrial Monitor Bezel) */}
                <div className="mt-5 neu-inset p-3 min-h-[320px] flex items-center justify-center overflow-hidden relative rounded-2xl">
                  {currentAssessment?.annotated_media_url ? (
                    <div className="w-full">
                      <img
                        src={`${API_BASE}${currentAssessment.annotated_media_url}`}
                        alt="Annotated Inspection"
                        className="w-full max-h-[460px] object-contain rounded-xl shadow-lg"
                      />
                      <div className="mt-2.5 neu-card p-3 flex justify-between text-xs text-slate-400">
                        <span>Total Objects: <strong className="text-white font-mono">{currentAssessment.detections_count}</strong></span>
                        <span>Latency: <strong className="text-emerald-400 font-mono">{currentAssessment.timing_ms?.inference_time} ms</strong></span>
                      </div>
                    </div>
                  ) : previewUrl ? (
                    <div className="w-full text-center">
                      <img
                        src={previewUrl}
                        alt="Preview"
                        className="w-full max-h-[460px] object-contain opacity-80 rounded-xl"
                      />
                      <div className="mt-2 neu-card p-2 text-xs text-amber-400 font-medium">
                        Image staged. Click <strong>"⚡ Run Safety Assessment"</strong> to run YOLOv8 model & risk rules.
                      </div>
                    </div>
                  ) : (
                    <div className="text-center p-8 text-slate-500">
                      <div className="w-14 h-14 rounded-2xl neu-card mx-auto flex items-center justify-center text-3xl mb-3">
                        🏗️
                      </div>
                      <p className="text-sm font-medium text-slate-400">No image loaded</p>
                      <p className="text-xs text-slate-600 mt-1">Upload a construction frame to view detections and hazard zones</p>
                    </div>
                  )}
                </div>
              </div>
            </div>

            {/* Right: Agentic Risk Assessment & Explainable Insights (5 cols) */}
            <div className="lg:col-span-5 space-y-5">
              <div className="neu-card p-6 flex flex-col h-full">
                <div className="flex items-center justify-between pb-4 mb-4 border-b border-slate-800/40">
                  <h2 className="text-sm font-bold text-slate-200 uppercase tracking-wider flex items-center gap-2">
                    <span>🤖</span> AI Site Risk Agent Insights
                  </h2>
                  {currentAssessment && <RiskBadge level={currentAssessment.risk_level} />}
                </div>

                {currentAssessment ? (
                  <div className="space-y-4 flex-1 overflow-y-auto max-h-[580px] pr-1">
                    
                    {/* Score Callout */}
                    <div className="neu-inset p-4 flex items-center justify-between">
                      <div>
                        <span className="text-[11px] text-slate-400 uppercase font-bold tracking-wider">Assessed Risk Score</span>
                        <div className="text-3xl font-black font-mono text-slate-100 mt-1">
                          {currentAssessment.site_risk_score} <span className="text-xs text-slate-500 font-sans">/ 100</span>
                        </div>
                      </div>
                      <div className="text-right">
                        <span className="text-[11px] text-slate-400 block mb-1 font-bold uppercase tracking-wider">Field Alert</span>
                        <span className={`px-3 py-1 text-xs font-bold rounded-full neu-badge ${
                          currentAssessment.alert?.alert_active
                            ? "bg-red-500/20 text-red-400 border border-red-500/40 shadow-[0_0_12px_rgba(239,68,68,0.4)] animate-pulse"
                            : "bg-emerald-500/15 text-emerald-400 border border-emerald-500/30"
                        }`}>
                          {currentAssessment.alert?.alert_active ? "⚠️ YES - DISPATCH" : "✓ NORMAL"}
                        </span>
                      </div>
                    </div>

                    {/* Executive Explanation */}
                    <div className="neu-card p-4 border border-blue-500/20 bg-blue-950/10">
                      <span className="text-[11px] font-bold text-blue-400 uppercase tracking-wider block mb-1.5">
                        Executive Explainable Summary
                      </span>
                      <p className="text-xs text-slate-300 leading-relaxed whitespace-pre-line font-medium">
                        {currentAssessment.executive_summary}
                      </p>
                    </div>

                    {/* Identified Hazards List */}
                    <div>
                      <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2.5">
                        Identified Hazards ({currentAssessment.hazards?.length || 0})
                      </h3>
                      {currentAssessment.hazards && currentAssessment.hazards.length > 0 ? (
                        <div className="space-y-2.5">
                          {currentAssessment.hazards.map((h, i) => (
                            <div key={i} className="neu-card-sm p-3.5 space-y-2 text-xs">
                              <div className="flex items-center justify-between">
                                <span className="font-bold text-slate-200">{h.rule_name}</span>
                                <RiskBadge level={h.severity} />
                              </div>
                              <div className="neu-inset px-2.5 py-1.5 text-slate-400 text-[11px]">
                                <strong className="text-slate-300">Evidence:</strong> {h.observed_evidence}
                              </div>
                              <div className="text-slate-400 text-[11px]">
                                <strong className="text-slate-300">Context:</strong> {h.spatial_context}
                              </div>
                              <div className="p-2 rounded-lg bg-amber-500/10 border border-amber-500/20 text-amber-300 font-semibold text-[11px]">
                                <strong>Recommended Action:</strong> {h.recommended_action}
                              </div>
                            </div>
                          ))}
                        </div>
                      ) : (
                        <div className="neu-inset p-3.5 text-xs text-emerald-400 font-medium flex items-center gap-2">
                          <span>✓</span> Compliant PPE observed. Zero safety violations or dangerous machine proximity detected.
                        </div>
                      )}
                    </div>
                  </div>
                ) : (
                  <div className="flex-1 flex flex-col items-center justify-center p-8 text-center text-slate-500">
                    <div className="w-14 h-14 rounded-2xl neu-inset flex items-center justify-center text-2xl mb-3 text-slate-400">
                      📋
                    </div>
                    <p className="text-xs font-medium text-slate-400">No active inspection loaded</p>
                    <p className="text-[11px] text-slate-600 mt-1">Upload an image on the left to trigger deterministic risk rules</p>
                  </div>
                )}
              </div>
            </div>
          </div>

          {/* Historical Monitoring Table */}
          <section className="neu-card p-6">
            <h2 className="text-sm font-bold text-slate-200 uppercase tracking-wider mb-4 flex items-center justify-between">
              <span>Recent Risk Monitoring Events</span>
              <span className="text-xs font-mono text-slate-500">Stored in SQLite / PostgreSQL</span>
            </h2>

            {history.length > 0 ? (
              <div className="overflow-x-auto neu-inset p-2 rounded-xl">
                <table className="w-full text-left text-xs">
                  <thead className="text-slate-400 border-b border-slate-800/80 uppercase text-[10px] tracking-wider">
                    <tr>
                      <th className="py-2.5 px-3">Timestamp</th>
                      <th className="py-2.5 px-3">Source File</th>
                      <th className="py-2.5 px-3">Risk Level</th>
                      <th className="py-2.5 px-3">Risk Score</th>
                      <th className="py-2.5 px-3">Hazards Detected</th>
                      <th className="py-2.5 px-3">Recommended Field Action</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800/40">
                    {history.map((item) => (
                      <tr key={item.id} className="hover:bg-slate-800/30 transition">
                        <td className="py-2.5 px-3 font-mono text-slate-400">
                          {item.created_at ? new Date(item.created_at).toLocaleTimeString() : "--"}
                        </td>
                        <td className="py-2.5 px-3 font-semibold text-slate-200 truncate max-w-[200px]">
                          {item.source_filename}
                        </td>
                        <td className="py-2.5 px-3">
                          <RiskBadge level={item.risk_level} />
                        </td>
                        <td className="py-2.5 px-3 font-mono font-bold text-slate-100">
                          {item.site_risk_score}
                        </td>
                        <td className="py-2.5 px-3 font-semibold">
                          {item.total_hazards_count}
                        </td>
                        <td className="py-2.5 px-3 text-slate-300 truncate max-w-[300px]">
                          {item.hazards && item.hazards.length > 0
                            ? item.hazards[0].recommended_action
                            : "Standard site compliance monitoring"}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            ) : (
              <div className="text-center py-6 text-xs text-slate-500">
                No past inspections recorded yet. Upload an image above to record the first event.
              </div>
            )}
          </section>

          {/* Footer */}
          <footer className="text-center text-xs text-slate-500 pt-2">
            Agentic Construction Risk Intelligence Platform &bull; Neumorphic Soft UI Edition &copy; 2026
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
