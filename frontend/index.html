<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentic Construction Risk Intelligence Platform</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Chart.js for visualizations -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    code, pre { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const API_BASE = (window.location.origin && window.location.origin.startsWith('http')) 
      ? window.location.origin 
      : 'http://localhost:8000';

    function RiskBadge({ level }) {
      const styles = {
        CRITICAL: "bg-red-500/20 text-red-400 border-red-500/50",
        HIGH: "bg-orange-500/20 text-orange-400 border-orange-500/50",
        MEDIUM: "bg-amber-500/20 text-amber-400 border-amber-500/50",
        LOW: "bg-emerald-500/20 text-emerald-400 border-emerald-500/50"
      };
      return (
        <span className={`px-2.5 py-1 text-xs font-semibold rounded-full border ${styles[level] || styles.LOW}`}>
          {level}
        </span>
      );
    }

    function App() {
      const [summary, setSummary] = useState(null);
      const [modelInfo, setModelInfo] = useState(null);
      const [history, setHistory] = useState([]);
      const [loading, setLoading] = useState(true);
      const [uploading, setUploading] = useState(false);
      const [currentAssessment, setCurrentAssessment] = useState(null);
      const [selectedFile, setSelectedFile] = useState(null);
      const [previewUrl, setPreviewUrl] = useState(null);
      const [confThreshold, setConfThreshold] = useState(0.25);
      const [error, setError] = useState(null);

      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      // Load initial dashboard data
      const fetchData = async () => {
        try {
          const [sumRes, modelRes, histRes] = await Promise.all([
            fetch(`${API_BASE}/dashboard/summary`),
            fetch(`${API_BASE}/model/info`),
            fetch(`${API_BASE}/risks?limit=8`)
          ]);
          
          if (sumRes.ok) setSummary(await sumRes.json());
          if (modelRes.ok) setModelInfo(await modelRes.json());
          if (histRes.ok) {
            const hData = await histRes.json();
            setHistory(hData.assessments || []);
          }
        } catch (err) {
          console.error("Fetch error:", err);
          setError("Failed to connect to backend API. Ensure FastAPI server is running.");
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchData();
      }, []);

      // Render Severity Distribution Chart
      useEffect(() => {
        if (!summary || !chartRef.current) return;
        const sev = summary.severity_distribution || { LOW: 0, MEDIUM: 0, HIGH: 0, CRITICAL: 0 };
        
        if (chartInstance.current) {
          chartInstance.current.destroy();
        }

        const ctx = chartRef.current.getContext('2d');
        chartInstance.current = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: ['Low', 'Medium', 'High', 'Critical'],
            datasets: [{
              data: [sev.LOW || 0, sev.MEDIUM || 0, sev.HIGH || 0, sev.CRITICAL || 0],
              backgroundColor: ['#10b981', '#f59e0b', '#f97316', '#ef4444'],
              borderWidth: 2,
              borderColor: '#0f172a'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: 'bottom',
                labels: { color: '#94a3b8', font: { size: 11 } }
              }
            },
            cutout: '70%'
          }
        });
      }, [summary]);

      // File selection handler
      const handleFileSelect = (e) => {
        const file = e.target.files[0];
        if (file) {
          setSelectedFile(file);
          setPreviewUrl(URL.createObjectURL(file));
        }
      };

      // Upload and Assess Risk
      const handleAssess = async () => {
        if (!selectedFile) return;
        setUploading(true);
        setError(null);

        const formData = new FormData();
        formData.append("file", selectedFile);
        formData.append("conf_threshold", confThreshold);

        try {
          const res = await fetch(`${API_BASE}/risk/assess`, {
            method: "POST",
            body: formData
          });

          if (!res.ok) {
            const errData = await res.json();
            throw new Error(errData.detail || "Analysis failed");
          }

          const data = await res.json();
          setCurrentAssessment(data);
          fetchData(); // refresh counters and history
        } catch (err) {
          setError(err.message);
        } finally {
          setUploading(false);
        }
      };

      const getScoreColor = (score) => {
        if (score >= 75) return "text-red-500 border-red-500";
        if (score >= 50) return "text-orange-500 border-orange-500";
        if (score >= 25) return "text-amber-500 border-amber-500";
        return "text-emerald-500 border-emerald-500";
      };

      return (
        <div className="max-w-7xl mx-auto px-4 py-6 space-y-6">
          {/* Header */}
          <header className="flex flex-col md:flex-row justify-between items-start md:items-center pb-4 border-b border-slate-800 gap-4">
            <div>
              <div className="flex items-center gap-3">
                <span className="p-2 bg-amber-500/10 border border-amber-500/30 rounded-lg text-amber-400 font-bold text-lg">⚠️</span>
                <div>
                  <h1 className="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
                    Construction Risk Intelligence Platform
                    <span className="text-xs font-semibold px-2 py-0.5 bg-blue-500/20 text-blue-400 border border-blue-500/30 rounded">
                      YOLOv8 + Agentic Risk Engine
                    </span>
                  </h1>
                  <p className="text-xs text-slate-400">
                    Decision-Support Safety Monitoring & Explainable Hazard Assessment
                  </p>
                </div>
              </div>
            </div>

            {/* Model & System Badge */}
            <div className="flex items-center gap-3 text-xs bg-slate-900 border border-slate-800 px-3 py-2 rounded-lg">
              <div className="flex items-center gap-1.5">
                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span className="text-slate-300 font-medium">Model Active:</span>
                <span className="text-emerald-400 font-mono">yolov8n (25 classes)</span>
              </div>
              <span className="text-slate-700">|</span>
              <div className="text-slate-400">
                Device: <span className="text-slate-200 font-mono">{modelInfo?.device || "CPU"}</span>
              </div>
            </div>
          </header>

          {error && (
            <div className="p-4 bg-red-500/10 border border-red-500/40 rounded-xl text-red-300 text-sm flex items-center justify-between">
              <span>⚠️ {error}</span>
              <button onClick={() => setError(null)} className="text-red-400 hover:text-white">✕</button>
            </div>
          )}

          {/* KPI Summary Cards */}
          <section className="grid grid-cols-2 md:grid-cols-4 gap-4">
            {/* Current Site Risk Score */}
            <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-4 flex flex-col justify-between">
              <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Current Site Risk</span>
              <div className="my-2 flex items-baseline gap-2">
                <span className={`text-4xl font-extrabold font-mono ${getScoreColor(summary?.current_risk_score || 0).split(' ')[0]}`}>
                  {summary ? summary.current_risk_score : "--"}
                </span>
                <span className="text-xs text-slate-500">/ 100</span>
              </div>
              <div className="flex items-center justify-between">
                <span className="text-xs text-slate-400">Risk Status</span>
                <RiskBadge level={summary?.current_risk_level || "LOW"} />
              </div>
            </div>

            {/* Total Hazards */}
            <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-4 flex flex-col justify-between">
              <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Hazards Identified</span>
              <div className="my-2">
                <span className="text-4xl font-extrabold font-mono text-white">
                  {summary ? summary.total_hazards_detected : "--"}
                </span>
              </div>
              <span className="text-xs text-slate-500">Across verified monitoring events</span>
            </div>

            {/* Monitored Scans */}
            <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-4 flex flex-col justify-between">
              <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Site Inspections Run</span>
              <div className="my-2">
                <span className="text-4xl font-extrabold font-mono text-white">
                  {summary ? summary.total_monitored_events : "--"}
                </span>
              </div>
              <span className="text-xs text-slate-500">Persisted in database</span>
            </div>

            {/* Severity Distribution Donut */}
            <div className="bg-slate-900/90 border border-slate-800 rounded-xl p-3 flex flex-col items-center justify-center relative">
              <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider self-start mb-1">Hazard Severity</span>
              <div className="w-full h-24">
                <canvas ref={chartRef}></canvas>
              </div>
            </div>
          </section>

          {/* Main Workspace Grid */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            {/* Left: Upload & Detection Visualizer (7 cols) */}
            <div className="lg:col-span-7 space-y-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
                <h2 className="text-base font-semibold text-white mb-3 flex items-center justify-between">
                  <span>Site Inspection & Visual Assessment</span>
                  <div className="flex items-center gap-2">
                    <label className="text-xs text-slate-400">Confidence:</label>
                    <input 
                      type="range" 
                      min="0.15" 
                      max="0.80" 
                      step="0.05"
                      value={confThreshold}
                      onChange={(e) => setConfThreshold(parseFloat(e.target.value))}
                      className="w-20 accent-blue-500 cursor-pointer"
                    />
                    <span className="text-xs font-mono text-blue-400">{confThreshold.toFixed(2)}</span>
                  </div>
                </h2>

                {/* Upload Zone */}
                <div className="border-2 border-dashed border-slate-700 hover:border-slate-500 transition rounded-xl p-4 text-center bg-slate-950/50">
                  <input
                    type="file"
                    accept="image/*"
                    onChange={handleFileSelect}
                    id="file-upload"
                    className="hidden"
                  />
                  <label htmlFor="file-upload" className="cursor-pointer flex flex-col items-center">
                    <span className="text-3xl mb-1">📸</span>
                    <span className="text-sm font-medium text-slate-200">
                      {selectedFile ? selectedFile.name : "Click to select or drop site image"}
                    </span>
                    <span className="text-xs text-slate-500 mt-0.5">Supports JPG, PNG, WEBP construction site photos</span>
                  </label>
                </div>

                {/* Action Buttons */}
                <div className="flex justify-between items-center mt-3">
                  <div className="text-xs text-slate-400">
                    {selectedFile && <span>Ready for Agentic Risk Assessment</span>}
                  </div>
                  <button
                    onClick={handleAssess}
                    disabled={!selectedFile || uploading}
                    className={`px-4 py-2 rounded-lg font-medium text-sm flex items-center gap-2 transition ${
                      !selectedFile || uploading
                        ? "bg-slate-800 text-slate-500 cursor-not-allowed"
                        : "bg-blue-600 hover:bg-blue-500 text-white shadow-lg shadow-blue-500/20"
                    }`}
                  >
                    {uploading ? (
                      <>
                        <span className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
                        Running Agent Assessment...
                      </>
                    ) : (
                      <>⚡ Run Safety Assessment</>
                    )}
                  </button>
                </div>

                {/* Visualizer Display */}
                <div className="mt-4 bg-slate-950 rounded-xl border border-slate-800 min-h-[300px] flex items-center justify-center overflow-hidden relative">
                  {currentAssessment?.annotated_media_url ? (
                    <div className="w-full">
                      <img
                        src={`${API_BASE}${currentAssessment.annotated_media_url}`}
                        alt="Annotated Inspection"
                        className="w-full max-h-[460px] object-contain rounded-lg"
                      />
                      <div className="p-2 bg-slate-900/90 border-t border-slate-800 flex justify-between text-xs text-slate-400">
                        <span>Detections: <strong className="text-white">{currentAssessment.detections_count}</strong></span>
                        <span>Inference Latency: <strong className="text-white font-mono">{currentAssessment.timing_ms?.inference_time} ms</strong></span>
                      </div>
                    </div>
                  ) : previewUrl ? (
                    <div className="w-full">
                      <img
                        src={previewUrl}
                        alt="Preview"
                        className="w-full max-h-[460px] object-contain opacity-75 rounded-lg"
                      />
                      <div className="p-2 bg-slate-900/90 border-t border-slate-800 text-center text-xs text-amber-400">
                        Image loaded. Click <strong>"Run Safety Assessment"</strong> to run YOLOv8 detection & risk rules.
                      </div>
                    </div>
                  ) : (
                    <div className="text-center p-8 text-slate-600">
                      <span className="text-4xl block mb-2">🏗️</span>
                      <p className="text-sm">Upload a construction site image to visualize bounding boxes and detect PPE / hazards</p>
                    </div>
                  )}
                </div>
              </div>
            </div>

            {/* Right: Agentic Risk Assessment & Explainable Insights (5 cols) */}
            <div className="lg:col-span-5 space-y-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col h-full">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <h2 className="text-base font-semibold text-white flex items-center gap-2">
                    <span>🤖</span> Site Risk Agent Insights
                  </h2>
                  {currentAssessment && <RiskBadge level={currentAssessment.risk_level} />}
                </div>

                {currentAssessment ? (
                  <div className="mt-4 space-y-4 flex-1 overflow-y-auto max-h-[580px] pr-1">
                    {/* Score Callout */}
                    <div className="p-4 bg-slate-950 rounded-xl border border-slate-800 flex items-center justify-between">
                      <div>
                        <span className="text-xs text-slate-400 uppercase font-medium">Assessed Risk Score</span>
                        <div className="text-3xl font-extrabold font-mono text-white mt-1">
                          {currentAssessment.site_risk_score} <span className="text-xs text-slate-500 font-sans">/ 100</span>
                        </div>
                      </div>
                      <div className="text-right">
                        <span className="text-xs text-slate-400 block mb-1">Alert Triggered</span>
                        <span className={`px-2.5 py-1 text-xs font-semibold rounded ${
                          currentAssessment.alert?.alert_active
                            ? "bg-red-500/20 text-red-400 border border-red-500/40 animate-pulse"
                            : "bg-emerald-500/20 text-emerald-400"
                        }`}>
                          {currentAssessment.alert?.alert_active ? "⚠️ YES - DISPATCH" : "NORMAL"}
                        </span>
                      </div>
                    </div>

                    {/* Executive Explanation */}
                    <div className="p-4 bg-blue-950/20 border border-blue-900/40 rounded-xl">
                      <span className="text-xs font-bold text-blue-400 uppercase tracking-wide block mb-1">
                        Executive Explainable Summary
                      </span>
                      <p className="text-xs text-slate-300 leading-relaxed whitespace-pre-line">
                        {currentAssessment.executive_summary}
                      </p>
                    </div>

                    {/* Identified Hazards List */}
                    <div>
                      <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wide mb-2">
                        Hazard Candidates ({currentAssessment.hazards?.length || 0})
                      </h3>
                      {currentAssessment.hazards && currentAssessment.hazards.length > 0 ? (
                        <div className="space-y-2">
                          {currentAssessment.hazards.map((h, i) => (
                            <div key={i} className="p-3 bg-slate-950 border border-slate-800 rounded-lg text-xs space-y-1.5">
                              <div className="flex items-center justify-between">
                                <span className="font-semibold text-slate-200">{h.rule_name}</span>
                                <RiskBadge level={h.severity} />
                              </div>
                              <div className="text-slate-400">
                                <strong>Evidence:</strong> {h.observed_evidence}
                              </div>
                              <div className="text-slate-400">
                                <strong>Context:</strong> {h.spatial_context}
                              </div>
                              <div className="p-2 bg-amber-500/10 border border-amber-500/20 rounded text-amber-300">
                                <strong>Action:</strong> {h.recommended_action}
                              </div>
                            </div>
                          ))}
                        </div>
                      ) : (
                        <div className="p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-lg text-xs text-emerald-300">
                          ✓ No safety rule violations observed. Compliant PPE and safe proximity confirmed.
                        </div>
                      )}
                    </div>
                  </div>
                ) : (
                  <div className="flex-1 flex flex-col items-center justify-center p-8 text-center text-slate-600">
                    <span className="text-3xl mb-2">📋</span>
                    <p className="text-xs">No active inspection loaded. Upload an image to trigger deterministic risk rules and explainable safety rationale.</p>
                  </div>
                )}
              </div>
            </div>
          </div>

          {/* Historical Monitoring Table */}
          <section className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
            <h2 className="text-base font-semibold text-white mb-3 flex items-center justify-between">
              <span>Recent Risk Monitoring Events</span>
              <span className="text-xs text-slate-400">Stored in Database</span>
            </h2>

            {history.length > 0 ? (
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs">
                  <thead className="bg-slate-950 text-slate-400 border-b border-slate-800 uppercase text-[10px] tracking-wider">
                    <tr>
                      <th className="py-2.5 px-3">Timestamp</th>
                      <th className="py-2.5 px-3">Source File</th>
                      <th className="py-2.5 px-3">Risk Level</th>
                      <th className="py-2.5 px-3">Risk Score</th>
                      <th className="py-2.5 px-3">Hazards Detected</th>
                      <th className="py-2.5 px-3">Top Action</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800/60">
                    {history.map((item) => (
                      <tr key={item.id} className="hover:bg-slate-800/40 transition">
                        <td className="py-2.5 px-3 font-mono text-slate-400">
                          {item.created_at ? new Date(item.created_at).toLocaleTimeString() : "--"}
                        </td>
                        <td className="py-2.5 px-3 font-medium text-slate-200 truncate max-w-[200px]">
                          {item.source_filename}
                        </td>
                        <td className="py-2.5 px-3">
                          <RiskBadge level={item.risk_level} />
                        </td>
                        <td className="py-2.5 px-3 font-mono font-bold">
                          {item.site_risk_score}
                        </td>
                        <td className="py-2.5 px-3">
                          {item.total_hazards_count}
                        </td>
                        <td className="py-2.5 px-3 text-slate-300 truncate max-w-[300px]">
                          {item.hazards && item.hazards.length > 0
                            ? item.hazards[0].recommended_action
                            : "Standard monitoring"}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            ) : (
              <div className="text-center py-6 text-xs text-slate-500">
                No past inspections recorded yet. Upload an image above to record the first event.
              </div>
            )}
          </section>

          {/* Footer */}
          <footer className="pt-4 border-t border-slate-800 text-center text-xs text-slate-500">
            Agentic Construction Risk Intelligence Platform &copy; 2026 &bull; Decision Support Prototype
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
